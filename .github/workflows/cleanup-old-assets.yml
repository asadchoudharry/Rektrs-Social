name: Cleanup old social assets

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete dated folders older than 7 days
        shell: bash
        run: |
          set -euo pipefail
          today_epoch=$(date -u +%s)
          deleted=0

          for dir in */; do
            name="${dir%/}"

            if [[ ! "$name" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              continue
            fi

            folder_epoch=$(date -u -d "$name" +%s 2>/dev/null || true)
            if [[ -z "$folder_epoch" ]]; then
              continue
            fi

            age_days=$(( (today_epoch - folder_epoch) / 86400 ))

            if (( age_days >= 7 )); then
              echo "Removing $name ($age_days days old)"
              rm -rf -- "$name"
              deleted=1
            fi
          done

          if (( deleted == 1 )); then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A

            if ! git diff --cached --quiet; then
              git commit -m "chore: remove social assets older than 7 days"
              git push
            fi
          else
            echo "No expired asset folders found."
          fi
